name: Firebase Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            linklearn-ai/package-lock.json
            functions/package-lock.json

      - name: Clear npm cache (if needed)
        run: npm cache clean --force || true

      - name: Install linklearn-ai dependencies
        working-directory: ./linklearn-ai
        run: |
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit --no-fund && break || {
              echo "Attempt $i failed, clearing cache and retrying..."
              npm cache clean --force
              [ $i -eq 3 ] && exit 1
              sleep 2
            }
          done
        timeout-minutes: 10

      - name: Build linklearn-ai
        working-directory: ./linklearn-ai
        run: npm run build
        timeout-minutes: 15

      - name: Install functions dependencies
        working-directory: ./functions
        run: |
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit --no-fund && break || {
              echo "Attempt $i failed, clearing cache and retrying..."
              npm cache clean --force
              [ $i -eq 3 ] && exit 1
              sleep 2
            }
          done
        timeout-minutes: 10

      - name: Build functions
        working-directory: ./functions
        run: npm run build
        timeout-minutes: 15

      - name: Cache Firebase Tools
        id: cache-firebase-tools
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: firebase-tools-${{ runner.os }}

      - name: Install Firebase Tools
        if: steps.cache-firebase-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.npm-global
          npm config set prefix '~/.npm-global'
          npm install -g firebase-tools --prefer-offline --no-audit
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
        timeout-minutes: 5

      - name: Setup Firebase Tools Path
        if: steps.cache-firebase-tools.outputs.cache-hit == 'true'
        run: echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Deploy Firebase Hosting (from linklearn-ai)
        working-directory: ./linklearn-ai
        run: firebase deploy --only hosting --project linklearn-ai --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Firebase Functions, Firestore Rules, and Storage Rules
        run: firebase deploy --only functions,firestore:rules,storage:rules --project linklearn-ai --token "${{ secrets.FIREBASE_TOKEN }}"
