name: Firebase Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            linklearn-ai/package-lock.json
            functions/package-lock.json

      - name: Install linklearn-ai dependencies
        working-directory: ./linklearn-ai
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Install functions dependencies
        working-directory: ./functions
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Build linklearn-ai
        working-directory: ./linklearn-ai
        run: npm run build

      - name: Build functions
        working-directory: ./functions
        run: npm run build

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting (from linklearn-ai)
        working-directory: ./linklearn-ai
        run: firebase deploy --only hosting --project linklearn-ai --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: Deploy Firebase Functions, Firestore Rules, and Storage Rules
        run: firebase deploy --only functions,firestore:rules,storage:rules --project linklearn-ai --token "${{ secrets.FIREBASE_TOKEN }}"
